name: Build patched xgameruntime.dll

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix

      - name: Build DLL and tests
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-gcc-posix -shared -O2 -Wall -Wextra             -o dist/xgameruntime.dll src/xgameruntime.c
          x86_64-w64-mingw32-gcc-posix -O2 -Wall -Wextra             -o dist/test_xgr.exe tests/test_xgr.c
          x86_64-w64-mingw32-gcc-posix -O2 -Wall -Wextra             -o dist/test_queue_lifetime.exe tests/test_queue_lifetime.c
          (cd dist && sha256sum xgameruntime.dll > SHA256SUMS.txt)

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Dungeons-2-Linux-Patches
          path: |
            dist/xgameruntime.dll
            dist/SHA256SUMS.txt
            dist/test_xgr.exe
            dist/test_queue_lifetime.exe
