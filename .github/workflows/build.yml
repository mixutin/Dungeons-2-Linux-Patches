name: Build patched xgameruntime.dll

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build DLL and tests
        run: |
          mkdir -p dist
          zig cc -target x86_64-windows-gnu -shared -O2 -Wall -Wextra             -o dist/xgameruntime.dll src/xgameruntime.c
          zig cc -target x86_64-windows-gnu -O2 -Wall -Wextra             -o dist/test_xgr.exe tests/test_xgr.c
          zig cc -target x86_64-windows-gnu -O2 -Wall -Wextra             -o dist/test_queue_lifetime.exe tests/test_queue_lifetime.c
          (cd dist && sha256sum xgameruntime.dll > SHA256SUMS.txt)

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Dungeons-2-Linux-Patches
          path: |
            dist/xgameruntime.dll
            dist/SHA256SUMS.txt
            dist/test_xgr.exe
            dist/test_queue_lifetime.exe
